[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aksara-lang"
version = "0.1.1"
description = "🇮🇩 Bahasa Pemrograman Indonesia Modern dengan AI Built-in"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [{name = "Joko Susilo"}]
keywords = ["aksara", "bahasa", "indonesia", "programming", "language", "interpreter", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = ["numpy"]

[project.scripts]
aksara = "aksara.cli:main"

[tool.setuptools.packages.find]
include = ["aksara*"]

[tool.setuptools]
packages = ["aksara", "aksara.lexer", "aksara.parser", "aksara.ast", "aksara.interpreter", "aksara.ai", "aksara.stdlib", "aksara.utils"]
